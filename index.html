<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LogiCards - Lojistik İngilizcesi Kelime Kartları</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="app-container">
        <header class="app-header">
            <div class="brand">Logi<span class="highlight">Cards</span></div>
            <button id="theme-toggle" class="theme-btn" aria-label="Tema Değiştir">🌙</button>
        </header>

        <main class="card-zone">
            <div class="card-stack" id="card-container">
                <div class="fallback-screen" id="status-message">
                    <div class="spinner"></div>
                    <p>Lojistik Veritabanı Yükleniyor...</p>
                </div>
            </div>
        </main>

        <footer class="control-panel">
            <div class="action-row">
                <button class="circle-btn btn-redo" onclick="triggerSwipe('left')" title="Tekrar Et">🔁</button>
                <button class="circle-btn btn-fav" onclick="triggerSwipe('up')" title="Favoriye Ekle">⭐</button>
                <button class="circle-btn btn-hard" onclick="triggerSwipe('down')" title="Zor Kelime">🚩</button>
                <button class="circle-btn btn-check" onclick="triggerSwipe('right')" title="Öğrendim">✅</button>
            </div>
        </footer>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
